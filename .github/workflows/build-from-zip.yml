name: build-from-zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压源码
        run: |
          mkdir -p src
          unzip -q -o pet-module-src.zip -d src
          echo "解压出 $(find src -type f | wc -l) 个文件"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 固定 Gradle 8.7
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: 编译 APK
        working-directory: src/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 打模块 zip
        working-directory: src
        run: node tools/build-module.js android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: screen-pet-module
          path: src/dist/*.zip
          if-no-files-found: error
